spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/code2career}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:abc123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}
spring.flyway.validate-on-migrate=true

# Override JWT_SECRET in every non-local environment with a random value of at least 32 bytes.
app.jwt.secret=${JWT_SECRET:local-development-secret-that-must-be-overridden-in-production-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.code-runner.url=${CODE_RUNNER_URL:http://localhost:8090}
app.api.max-request-bytes=${API_MAX_REQUEST_BYTES:262144}
app.api.general-requests-per-minute=${API_GENERAL_REQUESTS_PER_MINUTE:120}
app.api.auth-requests-per-minute=${API_AUTH_REQUESTS_PER_MINUTE:10}
app.api.execution-requests-per-minute=${API_EXECUTION_REQUESTS_PER_MINUTE:20}

management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,info,metrics}
management.endpoint.health.probes.enabled=${MANAGEMENT_HEALTH_PROBES:true}
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_DETAILS:never}
management.info.env.enabled=false
logging.pattern.level=%5p [corr:%X{correlationId}]
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
