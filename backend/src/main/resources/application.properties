spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/code2career}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:abc123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}
spring.flyway.validate-on-migrate=true

# Provide a cryptographically random JWT_SECRET of at least 32 bytes.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.code-runner.url=${CODE_RUNNER_URL:http://localhost:8090}
app.code-runner.token=${CODE_RUNNER_TOKEN:}
app.api.max-request-bytes=${API_MAX_REQUEST_BYTES:16777216}
app.api.general-requests-per-minute=${API_GENERAL_REQUESTS_PER_MINUTE:120}
app.api.auth-requests-per-minute=${API_AUTH_REQUESTS_PER_MINUTE:10}
app.api.execution-requests-per-minute=${API_EXECUTION_REQUESTS_PER_MINUTE:20}
app.password-reset.code-expiration-minutes=${PASSWORD_RESET_CODE_EXPIRATION_MINUTES:10}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:false}
# Mail delivery is optional in local development. Enable its health contributor only
# when an SMTP service has been configured and is expected to be reachable.
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:5000}
app.mail.from=${MAIL_FROM:noreply@code2career.local}

management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,info,metrics}
management.endpoint.health.probes.enabled=${MANAGEMENT_HEALTH_PROBES:true}
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_DETAILS:never}
management.health.mail.enabled=${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
management.info.env.enabled=false
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:none}
server.error.include-message=never
logging.pattern.level=%5p [corr:%X{correlationId}]
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

server.tomcat.max-http-form-post-size=${TOMCAT_MAX_HTTP_FORM_POST_SIZE:16MB}
server.tomcat.max-swallow-size=${TOMCAT_MAX_SWALLOW_SIZE:16MB}
